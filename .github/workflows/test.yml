name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install devmemory (editable, dev + mcp extras)
        run: pip install -e ".[dev,mcp]"
      - name: Run tests
        run: pytest -q

  packaging:
    name: packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/devmemory-packaging-venv
          /tmp/devmemory-packaging-venv/bin/pip install dist/*.whl
      - name: Verify the installed CLI works outside the source tree
        run: |
          cd /tmp
          /tmp/devmemory-packaging-venv/bin/devmemory --version
          /tmp/devmemory-packaging-venv/bin/devmemory --help

  install-script:
    name: install.sh syntax + static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: bash -n install.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: install.sh
